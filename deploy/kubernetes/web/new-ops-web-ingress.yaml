apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: demo.new-ops.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: new-ops-web
            port:
              number: 8080
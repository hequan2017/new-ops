name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (go build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Vet
        working-directory: server
        run: go vet ./...

      # 场85-87 已根治测试污染与环境依赖（ast 对称性/守卫跳过），可全量运行
      - name: Test
        working-directory: server
        run: go test ./...

  agent:
    name: agent (go build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: agent
        run: go build ./...

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test
        working-directory: agent
        run: go test ./...

  web:
    name: web (vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        working-directory: web
        run: npm run build
